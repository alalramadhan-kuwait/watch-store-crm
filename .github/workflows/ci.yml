name: CI

# Every push to main is typechecked, built, and — only if that passes —
# published to GitHub Pages. Nothing is deployed from a laptop any more:
# the live site is always exactly what is on main, built once, by this.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # hard gates — a broken build or type error fails the run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # handed to the deploy job so the site is built exactly once
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # let a running deploy finish; queue at most one behind it
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Pages still serves the gh-pages branch, so no repository setting
      # changes. The branch is rebuilt from scratch each time — it is build
      # output, and keeping its history would only bloat the repository.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
