name: CI

# Every push to main is typechecked, built, and — only if that passes —
# published to GitHub Pages. Nothing is deployed from a laptop any more:
# the live site is always exactly what is on main, built once, by this.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # the version being built, handed to the deploy job for its release tag
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # hard gates — a broken build or type error fails the run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # handed to the deploy job so the site is built exactly once
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # let a running deploy finish; queue at most one behind it
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Pages still serves the gh-pages branch, so no repository setting
      # changes. The branch is rebuilt from scratch each time — it is build
      # output, and keeping its history would only bloat the repository.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
      # Mark where each version first shipped. A version already tagged is
      # left alone, so only the deploy that introduces a new number creates
      # one, and nobody has to remember to. The site is live before this step
      # runs; a tagging problem warns rather than turning a good deploy red.
      - name: Tag the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.verify.outputs.version }}
        run: |
          code=$(curl -s -o /tmp/tag.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs" \
            -d "{\"ref\":\"refs/tags/$TAG\",\"sha\":\"$GITHUB_SHA\"}")
          case "$code" in
            201) echo "Tagged $TAG at ${GITHUB_SHA::7}" ;;
            422) echo "$TAG already exists: this deploy did not change the version" ;;
            *)   echo "::warning::Could not tag $TAG (HTTP $code): $(cat /tmp/tag.json)"; exit 1 ;;
          esac
